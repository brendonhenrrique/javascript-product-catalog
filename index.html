<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link rel="stylesheet" href="./src/css/styles.css">
</head>

<body>
    <header class="header">
        <h1 class="header__title">Catálogo de Produtos</h1>

        <form class="header__search" role="search">
            <input class="header__search-input" type="search" placeholder="🔍 Buscar produtos em inglês (ex: phone, watch, shirt)..." aria-label="Buscar produtos">
            <button type="submit" class="header__search-button" aria-label="Pesquisar">
                <img src="./src/assets/icon/search.svg" alt="Icone pesquisar">
            </button>
        </form>
    </header>

    <main>
        <aside class="sidebar">
            <nav aria-label="Categorias">
                <h2 class="sidebar__title">Categorias</h2>
                <ul class="sidebar__list sidebar__list--collapsed" id="category-list">
                    <li class="sidebar__item">
                        <button class="sidebar__button sidebar__button--active" data-category="all">
                            Todos os produtos
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="beauty">
                            Beleza
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="fragrances">
                            Fragrâncias
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="furniture">
                            Móveis
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="groceries">
                            Mercado
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="home-decoration">
                            Decoração para Casa
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="kitchen-accessories">
                            Acessórios de Cozinha
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="laptops">
                            Notebooks
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="mens-shirts">
                            Camisas Masculinas
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="mens-shoes">
                            Calçados Masculinos
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="mens-watches">
                            Relógios Masculinos
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="mobile-accessories">
                            Acessórios para Celular
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="motorcycle">
                            Motos
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="skin-care">
                            Cuidados com a Pele
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="smartphones">
                            Smartphones
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="sports-accessories">
                            Acessórios Esportivos
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="sunglasses">
                            Óculos de Sol
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="tablets">
                            Tablets
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="tops">
                            Blusas
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="vehicle">
                            Veículos
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="womens-bags">
                            Bolsas Femininas
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="womens-dresses">
                            Vestidos Femininos
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="womens-jewellery">
                            Joias Femininas
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="womens-shoes">
                            Calçados Femininos
                        </button>
                    </li>
                    <li class="sidebar__item">
                        <button class="sidebar__button" data-category="womens-watches">
                            Relógios Femininos
                        </button>
                    </li>
                </ul>
                <button class="sidebar__toggle-btn" id="toggle-btn">Ver mais</button>
            </nav>
        </aside>

        <section class="catalog">
            <div class="catalog__header">
                <h2 class="catalog__title">Produtos</h2>

                <div class="catalog__sort">
                    <label class="catalog__sort-label" for="sort">
                        Ordenar por
                    </label>

                    <select class="catalog__sort-select" id="sort" name="sort">
                        <option value="default" selected>Mais Relevantes</option>
                        <option value="price-asc">Menor Preço</option>
                        <option value="price-desc">Maior Preço</option>
                    </select>
                </div>
            </div>

            <div class="catalog__grid">
            </div>

            <nav class="pagination" aria-label="Paginação do catálogo">
                <p class="pagination__info"></p>
                <ul class="pagination__list">
                    <li class="pagination__item">
                        <button class="pagination__button pagination__button--start ">&laquo;</button>
                    </li>
                    <li class="pagination__item">
                        <button class="pagination__button pagination__button--previous">&lsaquo;</button>
                    </li>
                    <li class="pagination__item">
                        <button class="pagination__button pagination__button--number pagination__button--active">1</button>
                    </li>
                    <li class="pagination__item">
                        <button class="pagination__button pagination__button--next">&rsaquo;</button>
                    </li>
                    <li class="pagination__item">
                        <button class="pagination__button pagination__button--end">&raquo;</button>
                    </li>
                </ul>
            </nav>
        </section>
    </main>
    <script type="module" src="/src/js/main.js"></script>
</body>

</html>
